argocd:
  name: argo-cd
  namespace: argo-cd
  version: 5.34.3
  values:
    global:
      domain: argo-cd-virtual.mgmt.kub-poc.local
      hostAliases:
        - ip: 192.168.56.133
          hostnames:
            - argo-cd-virtual.mgmt.kub-poc.local
            - grafana-virtual.mgmt.kub-poc.local
            - prometheus-virtual.mgmt.kub-poc.local
    server:
      ingress:
        enabled: true
        annotations:
          kubernetes.io/ingress.class: nginx
          nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
          nginx.ingress.kubernetes.io/ssl-passthrough: 'true'
          nginx.ingress.kubernetes.io/backend-protocol: HTTPS
          cert-manager.io/issuer: kub-poc-issuer
        hosts:
          - argo-cd-virtual.mgmt.kub-poc.local
        tls:
          - hosts:
              - argo-cd-virtual.mgmt.kub-poc.local
            secretName: argo-cd-server-tls
        https: true
    configs:
      params:
        server.insecure: 'false'
      cm:
        ui.cssurl: https://marius.oprin.ro/cbsl-branding/CBSL-style.css
        url: https://argo-cd-virtual.mgmt.kub-poc.local
      notifications:
        argocdUrl: https://argo-cd-virtual.mgmt.kub-poc.local
prometheus:
  name: prometheus
  namespace: monitoring
  version: 45.7.1
  values:
    grafana:
      ingress:
        enabled: true
        annotations:
          kubernetes.io/ingress.class: nginx
          nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
          nginx.ingress.kubernetes.io/ssl-passthrough: 'false'
          nginx.ingress.kubernetes.io/backend-protocol: HTTP
        hosts:
          - grafana-virtual.mgmt.kub-poc.local
        tls:
          - secretName: grafana-tls
            hosts:
              - grafana-virtual.mgmt.kub-poc.local
    prometheus:
      ingress:
        enabled: true
        annotations:
          kubernetes.io/ingress.class: nginx
          nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
          nginx.ingress.kubernetes.io/ssl-passthrough: 'false'
          nginx.ingress.kubernetes.io/backend-protocol: HTTP
        hosts:
          - prometheus-virtual.mgmt.kub-poc.local
        tls:
          - secretName: prometheus-tls
            hosts:
              - prometheus-virtual.mgmt.kub-poc.local
ingress:
  name: ingress-nginx
  namespace: ingress-nginx
  version: 4.5.2
  values:
    controller:
      service:
        loadBalancerIP: 192.168.56.133
      extraArgs:
        enable-ssl-passthrough: 'true'
      config:
        use-forwarded-headers: 'true'
        ssl-redirect: 'true'
        force-ssl-redirect: 'true'
        ssl-passthrough: 'true'
tinkstack:
  name: tink-stack
  namespace: tink-system
  version: 0.4.4
  values:
    smee:
      publicIP: "192.168.56.130"
      hostNetwork: true
      trustedProxies: 10.0.0.0/8
    hegel:
      trustedProxies: 10.0.0.0/8
    rufio:
      image: quay.io/tinkerbell/rufio:v0.4.1
    stack:
      enabled: true
      kubevip:
        enabled: false
      lbClass: kube-vip.io/kube-vip-class
      loadBalancerIP: 192.168.56.130
      name: tink-stack
      selector:
        app: tink-stack
      service:
        type: LoadBalancer
